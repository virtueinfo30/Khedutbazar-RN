name: Android Production Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App Version Name (versionName, e.g. 1.0.1)"
        required: true
        default: "1.0.1"
        type: string
      version_code:
        description: "Build / Version Code (versionCode - Check Firebase App Distribution for latest + 1, e.g. 6)"
        required: true
        default: "6"
        type: string
      release_notes:
        description: "Release Notes / Changelog for Testers (Optional - leave empty to auto-use latest git commit)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: android-prod-apk
  cancel-in-progress: false

jobs:
  build-and-distribute:
    name: Build Prod APK & Distribute to Firebase
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version inputs
        run: |
          VERSION_NAME="${{ inputs.version_name }}"
          VERSION_CODE="${{ inputs.version_code }}"
          echo "Validating Version Name: $VERSION_NAME"
          echo "Validating Version Code: $VERSION_CODE"

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::version_name cannot be empty"
            exit 1
          fi

          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer > 0 (received: $VERSION_CODE)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Enable Corepack & Yarn 3
        run: |
          corepack enable
          corepack prepare yarn@3.6.4 --activate

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: yarn install

      - name: Configure environment file
        run: |
          if [ -n "${{ secrets.ENV_PRODUCTION }}" ]; then
            echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
            echo "Wrote .env.production from ENV_PRODUCTION secret."
          elif [ -f ".env.production.example" ]; then
            cp .env.production.example .env.production
            echo "Created .env.production from example template."
          fi

      - name: Setup Android Keystore & signing credentials
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            mkdir -p android/app
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/khedutbazar.keystore
            echo "Decoded release keystore from secret."
          fi

          cat <<EOF > android/keystore.properties
          RELEASE_STORE_FILE=${{ secrets.ANDROID_RELEASE_STORE_FILE || 'app/khedutbazar.keystore' }}
          RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.ANDROID_RELEASE_KEY_ALIAS || 'khedutbazar' }}
          RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build APK and distribute via Firebase App Distribution
        env:
          FIREBASE_APP_ID_PROD: ${{ secrets.FIREBASE_APP_ID_PROD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          ANDROID_RELEASE_STORE_FILE: ${{ secrets.ANDROID_RELEASE_STORE_FILE || 'app/khedutbazar.keystore' }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS || 'khedutbazar' }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          bundle exec fastlane android_production_apk \
            version_name:"${{ inputs.version_name }}" \
            version_code:"${{ inputs.version_code }}" \
            release_notes:"${{ inputs.release_notes }}"

      - name: Clean sensitive signing files
        if: always()
        run: |
          rm -f android/keystore.properties
          rm -f android/app/firebase-service-account.json

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-${{ inputs.version_name }}-${{ inputs.version_code }}.apk
          path: android/app/build/outputs/apk/app-production-${{ inputs.version_name }}-${{ inputs.version_code }}.apk
          if-no-files-found: error
          retention-days: 30
